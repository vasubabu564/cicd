name: CI-CD Docker Deployment

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3️⃣ Build Spring Boot app
      - name: Build application
        run: mvn clean package -DskipTests

      # 4️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build & Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            vasubabu564/cicd-app:latest
            vasubabu564/cicd-app:${{ github.sha }}

      # 6️⃣ Deploy (SERVER / VM)
      - name: Deploy Application
        run: |
          docker stop cicd-app || true
          docker rm cicd-app || true
          docker run -d \
            --name cicd-app \
            -p 7788:7788 \
            vasubabu564/cicd-app:latest

name: CI-CD Docker Deploy

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            vasubabu564/cicd-app:latest
            vasubabu564/cicd-app:${{ github.sha }}

      - name: Deploy (restart container)
        run: |
          docker stop cicd-app || true
          docker rm cicd-app || true
          docker run -d --name cicd-app -p 7788:7788 vasubabu564/cicd-app:latest
